name: Verify Android Merge Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: merge_android_verify
  cancel-in-progress: true

jobs:
  verify_android_release:
    name: Verify Android arm64 release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash ./scripts/setup-google-services.sh
      - name: Enable Firebase Messaging
        run: bash ./scripts/add-firebase-messaging.sh
      - uses: ./.github/actions/free_up_space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Validate SQLCipher runtime payload
        run: |
          set -euxo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk

          # sqflite_sqlcipher must own libsqlcipher.so. If sqlite3 native assets
          # overwrite it, JNI_OnLoad disappears and Android crashes when opening
          # the encrypted Matrix database during startup.
          unzip -p "$apk" lib/arm64-v8a/libsqlcipher.so > /tmp/libsqlcipher.so
          readelf -Ws /tmp/libsqlcipher.so | grep -F 'JNI_OnLoad'

          # Parse DEX with Android's analyzer instead of raw `strings` (DEX string
          # encoding makes the latter unreliable). R8 must preserve SQLCipher's
          # Java package because its native layer registers JNI methods at load.
          apkanalyzer_bin="$(command -v apkanalyzer || true)"
          if [[ -z "$apkanalyzer_bin" ]]; then
            apkanalyzer_bin="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          fi
          test -n "$apkanalyzer_bin"
          "$apkanalyzer_bin" dex packages "$apk" | grep -F 'net.sqlcipher'
      - uses: actions/upload-artifact@v7
        with:
          name: fluffychat-runtime-fix-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
