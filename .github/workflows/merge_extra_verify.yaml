name: Extra Merge Verification

on:
  push:
    branches:
      - merge-verify-extra
    paths:
      - .github/workflows/merge_extra_verify.yaml

permissions:
  contents: write

jobs:
  verify_arm32_and_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash ./scripts/setup-google-services.sh
      - name: Enable Firebase Messaging
        run: bash ./scripts/add-firebase-messaging.sh
      - uses: ./.github/actions/free_up_space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Resolve dependencies and refresh lockfile
        run: flutter pub get
      - name: Build armeabi-v7a release APK
        run: flutter build apk --release --target-platform android-arm
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo 'pubspec.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git commit -m 'chore: refresh dependency lockfile after upstream merge'
          git push origin HEAD:merge-verify-extra
